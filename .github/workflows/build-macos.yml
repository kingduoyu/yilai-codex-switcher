name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        env:
          PUBLISH_DIR: ${{ github.workspace }}/dist
        run: bash build-macos.sh

      - name: Verify native update and rollback
        shell: bash
        run: >-
          python3 Tests/macos-update.py "$PWD/dist/易来 Codex 切换器.app"
          2>&1 | tee dist/macos-update-result.log

      - name: Render macOS UI proof
        run: >-
          "dist/易来 Codex 切换器.app/Contents/MacOS/YilaiCodexSwitcherMac"
          --screenshot "dist/implementation-macos.png" --update-state

      - name: Upload universal app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YilaiCodexSwitcher-macOS-universal
          path: |
            dist/YilaiCodexSwitcher-v*-macOS-universal.dmg
            dist/YilaiCodexSwitcher-v*-macOS-universal.zip
            dist/implementation-macos.png
            dist/macos-update-result.log
            dist/macos-update-result.json
            dist/macos-update-*/**/helper.log
          if-no-files-found: error
